name: CPU, contracts and packaged runtime
on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg bubblewrap util-linux python3 libc-bin libstdc++6 ripgrep
      - run: python -m pip install -r requirements.lock.txt
      - run: npm ci --prefix web
      - run: python -m unittest discover -s tests
      - run: npm run check --prefix web
      - run: npm run build --prefix web
      - run: python scripts/build_package.py --output dist
      - run: python scripts/check_package.py dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: auriga-wheel
          path: dist/*.whl
