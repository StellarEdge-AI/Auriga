name: CPU, contracts and packaged runtime
on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg bubblewrap util-linux python3 libc-bin libstdc++6 ripgrep
      # The Codex sandbox and its tests use unprivileged user namespaces, which Ubuntu runners restrict via AppArmor.
      - run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: python -m pip install -r requirements.lock.txt
      - run: npm ci --prefix web
      # The sandbox refuses user namespaces while supplementary groups are held, and Ubuntu's AppArmor bwrap
      # profile blocks its sudo fallback, so the tests run as the runner user without supplementary groups.
      - run: >-
          sudo env "PATH=$PATH" "HOME=$HOME" "LD_LIBRARY_PATH=$LD_LIBRARY_PATH"
          setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups
          python -m unittest discover -s tests
      - run: npm run check --prefix web
      - run: npm run build --prefix web
      - run: python scripts/build_package.py --output dist
      - run: python scripts/check_package.py dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: auriga-wheel
          path: dist/*.whl
